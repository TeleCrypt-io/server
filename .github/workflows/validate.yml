name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test image and release contracts
        run: python3 .github/scripts/test_validate.py

      - name: Parse Quadlet with Stage Podman
        run: |
          set -euo pipefail
          test "$(podman --version)" = "podman version 4.9.3"
          QUADLET_UNIT_DIRS="$GITHUB_WORKSPACE/systemd/quadlet" \
            /usr/lib/systemd/user-generators/podman-user-generator --dryrun --no-kmsg-log \
            > "$RUNNER_TEMP/server-state-generated-units"
          test -s "$RUNNER_TEMP/server-state-generated-units"

      - name: Render masterless Salt states
        run: |
          set -euo pipefail
          salt_version="$(<salt/version)"
          test "$salt_version" = "3008.2"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/salt-archive-keyring.pgp >/dev/null
          curl -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.sources \
            | sudo tee /etc/apt/sources.list.d/salt.sources >/dev/null
          printf 'Package: salt-*\nPin: version 3008.*\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/salt-pin-1001 >/dev/null
          sudo apt-get update
          sudo apt-get install -y "salt-minion=$salt_version" "salt-common=$salt_version"
          pillar_dir="$RUNNER_TEMP/server-state-pillar"
          install -d -m 0700 "$pillar_dir"
          install -m 0600 salt/pillar/top.sls "$pillar_dir/top.sls"
          install -m 0600 salt/pillar/telecrypt.sls.example "$pillar_dir/telecrypt.sls"
          sudo salt-call --local --retcode-passthrough --out=raw \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.host > "$RUNNER_TEMP/salt-host-render"
          test -s "$RUNNER_TEMP/salt-host-render"
          sudo salt-call --local --retcode-passthrough --out=raw \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.services > "$RUNNER_TEMP/salt-services-render"
          test -s "$RUNNER_TEMP/salt-services-render"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve, validate and publish server release
        env:
          GH_TOKEN: ${{ github.token }}
          CASHIER_RELEASE_TOKEN: ${{ secrets.CASHIER_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag="$(python3 -c 'import sys; sys.path.insert(0,".github/scripts"); import validate; print(validate.release_tag(*sys.argv[1:]))' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          metadata_dir="$(mktemp -d)"
          authfile="$metadata_dir/auth.json"
          manifest_name="$tag-images.json"
          manifest_path="$metadata_dir/$manifest_name"
          trap 'rm -rf -- "$metadata_dir"' EXIT
          # An existing immutable result is consumed verbatim, never re-resolved.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$metadata_dir/release.json" 2>"$metadata_dir/release.stderr"; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$manifest_name" --dir "$metadata_dir"
            jq -e --arg sha "$GITHUB_SHA" --arg tag "$tag" '.source_commit == $sha and .server_state_tag == $tag' "$manifest_path"
            .github/scripts/verify-release.sh "$tag" "$manifest_name" "$manifest_path"
            exit 0
          elif ! grep -q '(HTTP 404)' "$metadata_dir/release.stderr"; then
            cat "$metadata_dir/release.stderr" >&2
            exit 1
          fi
          python3 .github/scripts/validate.py resolve "$metadata_dir"
          METADATA_DIR="$metadata_dir" .github/scripts/fetch_product_releases.sh
          python3 .github/scripts/validate.py selection-env "$metadata_dir" >"$metadata_dir/selection.env"
          printf '%s' "$GH_TOKEN" | container_command --sensitive --inherit-stdin "$metadata_dir/login.stdout" 30 \
            skopeo login --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          while IFS='=' read -r key image; do
            name="$(python3 .github/scripts/validate.py image-name "$image")"
            repository="${image%:*}"
            container_command "$metadata_dir/$key.tag-digest" 60 skopeo inspect --authfile "$authfile" \
              --no-tags --format '{{.Digest}}' "docker://$image"
            resolved_digest="$(<"$metadata_dir/$key.tag-digest")"
            [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            resolved_image="docker://$repository@$resolved_digest"
            container_command "$metadata_dir/$name.metadata" 60 skopeo inspect --authfile "$authfile" --no-tags \
              --override-os linux --override-arch amd64 --format '{{json .}}' "$resolved_image"
            container_command "$metadata_dir/$name.labels" 60 skopeo inspect --authfile "$authfile" \
              --override-os linux --override-arch amd64 --format '{{json .Labels}}' "$resolved_image"
            container_command "$metadata_dir/$name.config" 60 skopeo inspect --authfile "$authfile" --config \
              --override-os linux --override-arch amd64 "$resolved_image"
          done <"$metadata_dir/selection.env"
          # Validate the complete manifest before creating its annotated tag.
          export SERVER_STATE_ANNOTATED_TAG_SHA=0000000000000000000000000000000000000000
          python3 .github/scripts/validate.py image-release-manifest "$metadata_dir" "$tag" "$manifest_path"
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" -f message="Server release $tag" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_object"
          export SERVER_STATE_ANNOTATED_TAG_SHA="$tag_object"
          python3 .github/scripts/validate.py image-release-manifest "$metadata_dir" "$tag" "$manifest_path"
          gh release create "$tag" "$manifest_path" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes "Resolved server images for commit $GITHUB_SHA." --verify-tag
          .github/scripts/verify-release.sh "$tag" "$manifest_name" "$manifest_path"
