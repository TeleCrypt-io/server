name: validate

on:
  push:
    branches: [main]
    tags: ["server-state-*"]

concurrency:
  group: server-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELECRYPT_DATA_DIR: /tmp/telecrypt-data
      BILLING_ENVIRONMENT: test
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load canonical image manifest
        run: |
          set -euo pipefail
          python3 .github/scripts/validate.py source

      - name: Test published-image provenance contract
        run: |
          set -euo pipefail
          python3 .github/scripts/test_validate.py

      - name: Require deterministic-egress toolchain
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          engine_version="$(container_command "$RUNNER_TEMP/engine-version" 60 docker version --format '{{.Server.Version}}' | tr -d '\r\n')"
          compose_version="$(container_command "$RUNNER_TEMP/compose-version" 60 docker compose version --short | tr -d '\r\n')"
          python3 .github/scripts/validate.py toolchain "$engine_version" "$compose_version"

      - name: Authenticate package registry for exact manifest checks
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require every exact image manifest before Compose pulls
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          images_file="$RUNNER_TEMP/server-state-images"
          failures_file="$RUNNER_TEMP/server-state-image-failures"
          awk -F= 'NF == 2 { print $2 }' versions.env >"$images_file"
          test "$(wc -l <"$images_file")" -eq 5
          : >"$failures_file"
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            inspection_file="$RUNNER_TEMP/server-state-image-inspection"
            if ! container_command "$inspection_file" 60 \
              docker manifest inspect "$image"; then
              printf '%s\n' "$image" >>"$failures_file"
              printf 'image manifest unavailable: %s\n' "$image" >&2
            fi
          done <"$images_file"
          if [ -s "$failures_file" ]; then
            echo 'one or more exact image manifests are unavailable; no Compose pull was attempted' >&2
            cat "$failures_file" >&2
            exit 1
          fi

      - name: Require annotated exact release tag on refreshed main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
          release_commit="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          release_suffix="${GITHUB_REF_NAME#server-state-}"
          [[ "$release_commit" == "$release_suffix"* ]]
          test "$release_commit" = "$GITHUB_SHA"
          bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git_value rev-parse HEAD)" = "$release_commit"
          test "$release_commit" = "$GITHUB_SHA"
          test "$release_commit" = "$(git_value rev-parse refs/remotes/origin/main)"

      - name: Validate Compose
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          # Nonsecret CI placeholders satisfy Compose's required interpolation. Harness supplies
          # the snapshotted private values on the authorized deployment path.
          private_keys=(
            MAS_ADMIN_CLIENT_ID MAS_ADMIN_CLIENT_SECRET JANITOR_DB_URL OWNER_EMAIL JANITOR_DRY_RUN
            SMTP_HOST SMTP_USERNAME SMTP_PASSWORD SMTP_FROM
            MAS_OIDC_CLIENT_ID MAS_OIDC_CLIENT_SECRET PLAN_SESSION_KEY PLAN_ASSERTION_PRIVATE_KEY
            SYNAPSE_ADMIN_TOKEN CASHIER_DB_URL DODO_API_KEY DODO_WEBHOOK_SECRET DODO_PRODUCT_ID
            PLAN_ASSERTION_PUBLIC_KEY
          )
          for key in "${private_keys[@]}"; do
            printf '%s=ci-compose-fixture\n' "$key" >> "$GITHUB_ENV"
            export "$key=ci-compose-fixture"
          done
          mkdir -p "$TELECRYPT_DATA_DIR"
          fixture_secrets="$TELECRYPT_DATA_DIR/secrets"
          install -d -m 700 "$fixture_secrets"
          install -m 444 .github/fixtures/synapse.secrets.json "$fixture_secrets/synapse.secrets.json"
          install -m 444 .github/fixtures/synapse-signing-fixture.txt "$fixture_secrets/synapse_signing.key"
          install -m 444 .github/fixtures/mas.secrets.json "$fixture_secrets/mas.secrets.json"
          rendered_compose="$RUNNER_TEMP/server-state-compose.json"
          container_command --sensitive "$rendered_compose" 120 \
            docker compose --profile janitor --env-file .env.example config --format json
          rm -f -- "$rendered_compose.stderr"
          printf 'COMPOSE_RENDERED_JSON=%s\n' "$rendered_compose" >> "$GITHUB_ENV"

      - name: Verify rendered Compose closed contracts
        run: |
          python3 .github/scripts/validate.py rendered-compose "$COMPOSE_RENDERED_JSON"

      - name: Verify UID-991 secret runtime contract
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          synapse_output="$RUNNER_TEMP/synapse-secret-proof.log"
          if container_command --sensitive "$synapse_output" 120 docker compose --ansi never --env-file .env.example \
            -f .github/secret-proof.compose.yml run --rm --no-deps -T \
            --entrypoint python synapse-secret-proof -c '
          import os
          import json
          from pathlib import Path

          expected_json_keys = {"database", "matrix_authentication_service", "media_storage_providers", "macaroon_secret_key", "form_secret"}
          expected = {"/signing.key": "ed25519 0 AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8\n"}
          signing_key_material = expected["/signing.key"].split()[2]
          def fail(status, marker):
              print(f"telecrypt-synapse-proof:{marker}", flush=True)
              raise SystemExit(status)

          if os.getuid() != 991:
              fail(70, "uid")
          for path, value in expected.items():
              mounted = Path(path)
              try:
                  content = mounted.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  fail(71, "mount-content")
              if content != value:
                  fail(71, "mount-content")
          try:
              synapse_json = json.loads(Path("/secrets.json").read_text(encoding="utf-8"))
          except (OSError, UnicodeError, ValueError):
              fail(72, "secrets-json")
          if not isinstance(synapse_json, dict) or set(synapse_json) != expected_json_keys:
              fail(72, "secrets-json")
          for forbidden in ("/mas-secrets.json", "/run/secrets/mas_secrets_json"):
              try:
                  Path(forbidden).lstat()
              except FileNotFoundError:
                  continue
              except OSError:
                  fail(73, "forbidden-mount")
              fail(73, "forbidden-mount")
          environment = os.environ
          for variable in ("SYNAPSE_SECRETS_JSON", "SYNAPSE_SIGNING_KEY", "MAS_SECRETS_JSON"):
              if variable in environment:
                  fail(74, "environment-leak")
          for value in set(expected.values()) | {signing_key_material, "ci-mas-secret-fixture"}:
              if value in environment.values():
                  fail(74, "environment-leak")
          print("telecrypt-synapse-proof:success", flush=True)
          '; then
            proof_status=0
          else
            proof_status=$?
          fi
          proof_class="$(container_sensitive_proof_class "$proof_status" "$synapse_output" "$synapse_output.stderr")"
          if [[ "$proof_class" != success ]]; then
            rm -f -- "$synapse_output" "$synapse_output.stderr"
            printf 'Synapse secret proof failed: %s\n' "$proof_class" >&2
            exit 1
          fi
          rm -f -- "$synapse_output" "$synapse_output.stderr"
          echo 'uid-991 secret mount readable with only Synapse grants'

      # The pinned MAS image is distroless; use its bundled mas-cli directly rather than assuming
      # a shell or Python diagnostic exists. Capture config output so fixture values never reach CI logs.
      - name: Verify UID-991 MAS secret isolation
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          mkdir -p "$TELECRYPT_DATA_DIR/runtime"
          cat > "$TELECRYPT_DATA_DIR/runtime/mas.identity.yaml" <<'EOF'
          http:
            public_base: https://backend.stage.telecrypt.io/auth/
            issuer: https://backend.stage.telecrypt.io/auth/
          experimental:
            plan_management_iframe_uri: https://backend.stage.telecrypt.io/plan
          policy:
            data:
              admin_clients:
                - 01ARZ3NDEKTSV4RRFFQ69G5FAW
          EOF

          mas_container=ci-mas-secret-proof
          mas_output="$RUNNER_TEMP/mas-secret-proof.log"
          mas_user_output="$RUNNER_TEMP/mas-user"
          mas_mounts="$RUNNER_TEMP/mas-secret-mounts.json"
          cleanup_output="$RUNNER_TEMP/mas-secret-cleanup.log"
          cleanup_container() {
            local container="$1" lookup_output="$RUNNER_TEMP/mas-cleanup-$1.log" container_id status=0
            if ! container_command "$lookup_output" 30 docker ps -aq --filter "name=^/$container$"; then
              status=1
            elif ! container_id="$(tr -d '\r\n' <"$lookup_output")"; then
              status=1
            elif [[ -n "$container_id" ]] && ! container_command "$cleanup_output" 30 docker rm -f "$container_id"; then
              status=1
            fi
            if ! rm -f -- "$lookup_output" "$lookup_output.stderr"; then
              status=1
            fi
            return "$status"
          }
          cleanup() {
            local status=0
            cleanup_container "$mas_container" || status=1
            if ! rm -f -- "$mas_output" "$mas_output.stderr" "$mas_user_output" "$mas_user_output.stderr" \
              "$mas_mounts" "$mas_mounts.stderr" \
              "$cleanup_output" "$cleanup_output.stderr"; then
              status=1
            fi
            return "$status"
          }
          cleanup_on_exit() {
            local status=$?
            trap - EXIT
            if ! cleanup; then
              echo 'MAS secret proof failed: cleanup' >&2
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_on_exit EXIT

          mas_failure() {
            echo "MAS secret proof failed: $1" >&2
            exit 1
          }

          docker_value() {
            local output="$1" status
            shift
            if container_command "$output" 60 docker "$@"; then
              status=0
            else
              status=$?
            fi
            (( status == 0 )) || return "$status"
            tr -d '\r\n' <"$output"
          }
          if ! container_command --sensitive "$mas_output" 120 docker compose --ansi never --env-file .env.example \
            -f .github/secret-proof.compose.yml run \
            --name "$mas_container" --no-deps -T --entrypoint /usr/local/bin/mas-cli mas-secret-proof \
            config check --config=/config.yaml --config=/secrets.json --config=/runtime-identity.yaml; then
            mas_failure config-check
          fi
          if ! mas_check="$(<"$mas_output")"; then
            mas_failure config-output-read
          fi
          if ! mas_user="$(docker_value "$mas_user_output" inspect --format '{{.Config.User}}' "$mas_container")"; then
            mas_failure container-user-inspection
          fi
          if [[ "$mas_user" != "991:991" ]]; then
            mas_failure container-user-contract
          fi
          if ! container_command --sensitive "$mas_mounts" 60 docker inspect \
            --format '{{json .Mounts}}' "$mas_container"; then
            mas_failure mount-inspection
          fi
          if ! jq -e '
            type == "array" and length == 3 and
            ([.[].Destination] | sort) == ["/config.yaml", "/runtime-identity.yaml", "/secrets.json"] and
            all(.[]; .RW == false)
          ' "$mas_mounts" >/dev/null; then
            mas_failure mount-contract
          fi
          for marker in \
            ci-synapse-secret-fixture \
            'ed25519 0 AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8' \
            AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8; do
            if grep -F -- "$marker" <<<"$mas_check" >/dev/null; then
              mas_failure output-secret-isolation
            fi
          done
          if ! cleanup; then
            trap - EXIT
            mas_failure cleanup
          fi
          trap - EXIT
          echo "MAS uid 991 read its own file-backed secret and had only its three declared mounts"

      - name: Verify pinned Synapse JSON config loader
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          mkdir -p "$TELECRYPT_DATA_DIR/runtime"
          # .env.example selects the stage profile for this CI proof. The source validator proves
          # the closed production/stage map; this container proof loads both tracked profiles and
          # proves their values in the explicit base → environment → secrets → identity order.
          printf '%s\n' 'server_name: stage.telecrypt.io' 'public_baseurl: https://backend.stage.telecrypt.io/' > "$TELECRYPT_DATA_DIR/runtime/synapse.identity.yaml"
          printf '%s\n' 'http:' '  public_base: https://backend.stage.telecrypt.io/auth/' '  issuer: https://backend.stage.telecrypt.io/auth/' > "$TELECRYPT_DATA_DIR/runtime/mas.identity.yaml"
          synapse_loader_output="$RUNNER_TEMP/synapse-json-loader.log"
          synapse_loader_cleanup() {
            if ! rm -f -- "$synapse_loader_output" "$synapse_loader_output.stderr"; then
              echo 'Synapse JSON loader diagnostics cleanup failed' >&2
              return 1
            fi
            return 0
          }
          synapse_loader_cleanup_on_exit() {
            local status=$?
            trap - EXIT
            if ! synapse_loader_cleanup && [[ "$status" -eq 0 ]]; then status=1; fi
            exit "$status"
          }
          synapse_loader_failure() {
            echo "Synapse JSON loader proof failed: $1" >&2
            exit 1
          }
          trap synapse_loader_cleanup_on_exit EXIT
          synapse_loader_status=0
          if container_command --sensitive "$synapse_loader_output" 120 docker compose --ansi never --env-file .env.example \
            -f .github/secret-proof.compose.yml run --rm --no-deps -T \
            --entrypoint python synapse-loader-proof -c '
          import contextlib
          import io

          allowed_config_paths = {
              "server",
              "database",
              "logging",
              "repository",
              "key",
              "media",
              "listeners",
          }

          def config_marker(error):
              path = getattr(error, "path", None)
              if isinstance(path, (list, tuple)) and path:
                  top_level = path[0]
              elif isinstance(path, str):
                  top_level = path.split(".", 1)[0]
              else:
                  top_level = None
              if top_level in allowed_config_paths:
                  return "config-" + top_level
              return "config-unknown"

          def print_marker(marker):
              print("telecrypt-synapse-loader:" + marker)

          class LoaderFailure(Exception):
              pass

          marker = "unexpected"
          try:
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  from synapse.config._base import ConfigError
                  from synapse.config.homeserver import HomeServerConfig
                  try:
                      for profile_path, expected_limits in (
                          ("/synapse-environment.yaml", {
                              "rc_message": (1000, 1000),
                              "rc_room_creation": (1000, 1000),
                          }),
                          ("/synapse-production-environment.yaml", {
                              "rc_message": (0.2, 10),
                              "rc_room_creation": (0.016, 10),
                          }),
                      ):
                          config = HomeServerConfig.load_config(
                              "Synapse JSON loader proof",
                              ["-c", "/homeserver.yaml", "-c", profile_path, "-c", "/secrets.json", "-c", "/runtime-identity.yaml"],
                          )
                          server_name = getattr(getattr(config, "server", None), "server_name", None)
                          ratelimiting = getattr(config, "ratelimiting", None)
                          if config is None or server_name != "stage.telecrypt.io" or ratelimiting is None or any(
                              (setting := getattr(ratelimiting, name, None)) is None or
                              (setting.per_second, setting.burst_count) != limits
                              for name, limits in expected_limits.items()
                          ):
                              marker = "profile-values"
                              break
                      else:
                          marker = "success"
                  except ConfigError as error:
                      marker = config_marker(error)
                  except FileNotFoundError:
                      marker = "file-not-found"
                  except PermissionError:
                      marker = "permission"
                  except ModuleNotFoundError:
                      marker = "module-import"
                  except ImportError:
                      marker = "module-import"
                  except SystemExit:
                      marker = "parser-exit"
                  except LoaderFailure:
                      marker = "unexpected"
                  except Exception:
                      marker = "unexpected"
          except ModuleNotFoundError:
              marker = "module-import"
          except ImportError:
              marker = "module-import"
          except SystemExit:
              marker = "parser-exit"
          except Exception:
              marker = "unexpected"

          print_marker(marker)
          if marker != "success":
              raise SystemExit(1)
          '; then
            synapse_loader_status=0
          else
            synapse_loader_status=$?
          fi
          if ! synapse_loader_marker="$(cat -- "$synapse_loader_output")"; then
            synapse_loader_failure output-read
          fi
          if [[ -z "$synapse_loader_marker" && "$synapse_loader_status" -ne 0 ]]; then
            synapse_loader_failure container-run
          fi
          case "$synapse_loader_marker" in
            telecrypt-synapse-loader:success)
              if [[ "$synapse_loader_status" -ne 0 ]]; then
                synapse_loader_failure container-diagnostic
              fi
              trap - EXIT
              synapse_loader_cleanup
              echo 'Synapse JSON config loader accepted'
              ;;
            telecrypt-synapse-loader:config-server|telecrypt-synapse-loader:config-database|\
            telecrypt-synapse-loader:config-logging|telecrypt-synapse-loader:config-repository|\
            telecrypt-synapse-loader:config-key|telecrypt-synapse-loader:config-media|\
            telecrypt-synapse-loader:config-listeners|telecrypt-synapse-loader:config-unknown|\
            telecrypt-synapse-loader:file-not-found|telecrypt-synapse-loader:permission|\
            telecrypt-synapse-loader:module-import|telecrypt-synapse-loader:parser-exit|\
            telecrypt-synapse-loader:profile-values|telecrypt-synapse-loader:unexpected)
              synapse_loader_failure "${synapse_loader_marker#telecrypt-synapse-loader:}"
              ;;
            *)
              synapse_loader_failure output-contract
              ;;
          esac

      - name: Verify exact selected container images
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          images_file="$(mktemp)"
          raw_images_file="$(mktemp)"
          cleanup() {
            local status=0
            if ! rm -f -- "$images_file" "$raw_images_file"; then status=1; fi
            return "$status"
          }
          cleanup_on_exit() {
            local status=$?
            trap - EXIT
            if ! cleanup && [[ "$status" -eq 0 ]]; then status=1; fi
            exit "$status"
          }
          trap cleanup_on_exit EXIT
          container_command --sensitive "$raw_images_file" 120 \
            docker compose --profile janitor --env-file .env.example config --images
          rm -f -- "$raw_images_file.stderr"
          sort -u "$raw_images_file" > "$images_file"
          python3 .github/scripts/validate.py image-list "$images_file"

      - name: Validate Caddy
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          image_list="$RUNNER_TEMP/caddy-image-list"
          container_command --sensitive "$image_list" 120 \
            docker compose --profile janitor --env-file .env.example config --images
          rm -f -- "$image_list.stderr"
          caddy_image="$(awk '/docker.io\/caddy:/ { print; exit }' "$image_list")"
          test -n "$caddy_image"
          timeout --signal=TERM --kill-after=5s 120s docker run --rm \
            --user 65532:65532 \
            --read-only \
            --security-opt no-new-privileges=true \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --network none \
            --tmpfs /config/caddy:uid=65532,gid=65532,mode=0700 \
            --tmpfs /data/caddy:uid=65532,gid=65532,mode=0700 \
            --env TRUSTED_PROXY=192.0.2.10/32 \
            --env SERVER_NAME=example.invalid \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile
          caddy_adapted="$RUNNER_TEMP/caddy-adapted.json"
          container_command --sensitive "$caddy_adapted" 120 docker run --rm \
            --user 65532:65532 \
            --read-only \
            --security-opt no-new-privileges=true \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --network none \
            --tmpfs /config/caddy:uid=65532,gid=65532,mode=0700 \
            --tmpfs /data/caddy:uid=65532,gid=65532,mode=0700 \
            --env TRUSTED_PROXY=192.0.2.10/32 \
            --env SERVER_NAME=example.invalid \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty
          rm -f -- "$caddy_adapted.stderr"
          python3 .github/scripts/validate.py adapted-caddy "$caddy_adapted"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-state-')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact GitHub Release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          authdir="$(mktemp -d)"
          authfile="$authdir/auth.json"
          metadata_dir="$(mktemp -d)"
          manifest_name="server-state-${GITHUB_REF_NAME#server-state-}-images.json"
          manifest_path="$RUNNER_TEMP/$manifest_name"
          release_json_path="$RUNNER_TEMP/release.json"
          release_error_path="$RUNNER_TEMP/release.error"
          release_headers_path="$RUNNER_TEMP/release.headers"
          final_release_json_path="$RUNNER_TEMP/final-release.json"
          draft_dir="$RUNNER_TEMP/draft-release"
          final_dir="$RUNNER_TEMP/final-release"
          cleanup() {
            local status=0
            if ! rm -rf -- "$authdir" "$metadata_dir" "$manifest_path"; then status=1; fi
            if ! rm -f -- "$release_json_path" "$release_error_path" "$release_headers_path"; then status=1; fi
            if ! rm -f -- "$final_release_json_path"; then status=1; fi
            if ! rm -rf -- "$draft_dir" "$final_dir"; then status=1; fi
            return "$status"
          }
          cleanup_on_exit() {
            local status=$?
            trap - EXIT
            if ! cleanup && [[ "$status" -eq 0 ]]; then status=1; fi
            exit "$status"
          }
          trap cleanup_on_exit EXIT

          capture_active_pid=""
          capture_active_output=""
          capture_active_stderr=""
          capture_active_replay_output=true
          capture_command_signal() {
            local signal_name="$1" status=143 kill_status wait_status replay_status=0
            case "$signal_name" in
              HUP) status=129 ;;
              INT) status=130 ;;
              TERM) status=143 ;;
              *) status=143 ;;
            esac
            set +e
            if [[ -n "$capture_active_pid" ]]; then
              kill -0 "$capture_active_pid"
              kill_status=$?
              if [[ "$kill_status" -eq 0 ]]; then
                kill -TERM "$capture_active_pid"
                kill_status=$?
                if [[ "$kill_status" -ne 0 ]]; then
                  printf 'release capture child termination failed during %s (status %s)\n' "$signal_name" "$kill_status" >&2
                fi
              elif [[ "$kill_status" -ne 1 ]]; then
                printf 'release capture child liveness check failed during %s (status %s)\n' "$signal_name" "$kill_status" >&2
              fi
              wait "$capture_active_pid"
              wait_status=$?
              capture_active_pid=""
              if [[ "$wait_status" -eq 127 ]]; then
                printf 'release capture child wait failed during %s\n' "$signal_name" >&2
              fi
            fi
            if [[ -n "$capture_active_output" && "$capture_active_replay_output" == true ]] && ! cat -- "$capture_active_output" >&2; then replay_status=1; fi
            if [[ -n "$capture_active_stderr" ]] && ! cat -- "$capture_active_stderr" >&2; then replay_status=1; fi
            if [[ "$replay_status" -ne 0 ]]; then
              printf 'release capture diagnostics could not be replayed after %s\n' "$signal_name" >&2
            fi
            exit "$status"
          }

          capture_command() {
            local replay_output=true
            if [[ "${1:-}" == --binary-output ]]; then
              replay_output=false
              shift
            fi
            local output="$1" stderr="$2" timeout_seconds="$3" status replay_status=0
            shift 3
            local previous_hup previous_int previous_term
            previous_hup="$(trap -p HUP || true)"
            previous_int="$(trap -p INT || true)"
            previous_term="$(trap -p TERM || true)"
            capture_active_output="$output"
            capture_active_stderr="$stderr"
            capture_active_replay_output="$replay_output"
            trap 'capture_command_signal HUP' HUP
            trap 'capture_command_signal INT' INT
            trap 'capture_command_signal TERM' TERM
            set +e
            timeout --signal=TERM --kill-after=5s "${timeout_seconds}s" "$@" >"$output" 2>"$stderr" &
            capture_active_pid="$!"
            wait "$capture_active_pid"
            status=$?
            set -e
            capture_active_pid=""
            capture_active_output=""
            capture_active_stderr=""
            capture_active_replay_output=true
            if [[ -n "$previous_hup" ]]; then eval "$previous_hup"; else trap - HUP; fi
            if [[ -n "$previous_int" ]]; then eval "$previous_int"; else trap - INT; fi
            if [[ -n "$previous_term" ]]; then eval "$previous_term"; else trap - TERM; fi
            if [[ "$status" -ne 0 ]]; then
              if [[ "$replay_output" == true ]] && ! cat -- "$output" >&2; then replay_status=1; fi
              if ! cat -- "$stderr" >&2; then replay_status=1; fi
              if [[ "$replay_status" -ne 0 ]]; then
                echo 'captured command diagnostics could not be replayed' >&2
              fi
              return "$status"
            fi
            if ! cat -- "$stderr" >&2; then
              echo 'captured command stderr could not be emitted' >&2
              return 1
            fi
            return 0
          }

          replay_capture() {
            local output="$1" stderr="$2" status=0
            if ! cat -- "$output" >&2; then status=1; fi
            if ! cat -- "$stderr" >&2; then status=1; fi
            return "$status"
          }

          capture_jq() {
            local output="$1" stderr="$2" status
            shift 2
            if jq -e "$@" "$output" >/dev/null; then
              return 0
            else
              status="$?"
            fi
            replay_capture "$output" "$stderr" || echo 'captured response diagnostics could not be replayed' >&2
            return "$status"
          }

          capture_extract() {
            local variable="$1" output="$2" stderr="$3" value status
            shift 3
            if value="$(jq -er "$@" "$output")"; then
              printf -v "$variable" '%s' "$value"
              return 0
            else
              status="$?"
            fi
            replay_capture "$output" "$stderr" || echo 'captured response diagnostics could not be replayed' >&2
            return "$status"
          }

          http_status() {
            local count
            count="$(grep -Ec '^HTTP/[0-9.]+[[:space:]][0-9]{3}([[:space:]]|$)' "$1")"
            test "$count" -eq 1
            sed -n '1s/^HTTP\/[0-9.]*[[:space:]]\([0-9][0-9][0-9]\).*$/\1/p' "$1"
          }

          http_body() {
            awk 'BEGIN { body = 0 } { line = $0; sub(/\r$/, "", line); if (!body) { if (line == "") body = 1; next } print }' "$1"
          }

          replay_discovery_pages() {
            local status=0 page_headers
            for page_headers in "$metadata_dir"/release-page-*.headers; do
              [[ -e "$page_headers" ]] || continue
              if ! cat -- "$page_headers" >&2; then status=1; fi
              if ! cat -- "$page_headers.error" >&2; then status=1; fi
            done
            return "$status"
          }

          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          release_commit="$GITHUB_SHA"
          release_suffix="${GITHUB_REF_NAME#server-state-}"
          [[ "$release_commit" == "$release_suffix"* ]]
          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          test "$(git_value rev-parse HEAD)" = "$release_commit"
          test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
          checkout_annotated_tag_sha="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME")"
          python3 .github/scripts/validate.py source

          verify_source_identity() {
            local current_annotated_tag_sha current_tag_commit remote_annotated_tag_sha remote_tag_path
            timeout --signal=TERM --kill-after=5s 30s bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
              refs/heads/main:refs/remotes/origin/main \
              "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
            current_annotated_tag_sha="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME")"
            test "$current_annotated_tag_sha" = "$checkout_annotated_tag_sha"
            current_tag_commit="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
            test "$current_tag_commit" = "$release_commit"
            test "$(git_value rev-parse HEAD)" = "$release_commit"
            test "$(git_value rev-parse refs/remotes/origin/main)" = "$release_commit"
            remote_tag_path="$metadata_dir/remote-tag.log"
            capture_command "$remote_tag_path" "$remote_tag_path.stderr" 30 bash .github/scripts/git_transport.sh ls-remote "$GITHUB_REPOSITORY" \
              "refs/tags/$GITHUB_REF_NAME"
            test "$(wc -l < "$remote_tag_path")" = 1
            remote_annotated_tag_sha="$(awk 'NF == 2 { print $1 }' "$remote_tag_path")"
            [[ "$remote_annotated_tag_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$remote_annotated_tag_sha" = "$checkout_annotated_tag_sha"
          }

          verify_source_identity
          export SERVER_STATE_ANNOTATED_TAG_SHA="$checkout_annotated_tag_sha"
          # shellcheck disable=SC1091
          source versions.env
          METADATA_DIR="$metadata_dir" timeout --signal=TERM --kill-after=5s 240s .github/scripts/fetch_product_releases.sh
          login_stdout="$metadata_dir/skopeo-login.stdout"
          registry_token="$GH_TOKEN"
          unset GH_TOKEN
          if ! printf '%s' "$registry_token" | container_command --sensitive --inherit-stdin "$login_stdout" 30 skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io; then
            unset registry_token
            rm -f -- "$login_stdout" "$login_stdout.stderr"
            echo 'registry authentication failed' >&2
            exit 1
          fi
          rm -f -- "$login_stdout" "$login_stdout.stderr"
          for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
            image="${!key}"
            name="$(python3 .github/scripts/validate.py image-name "$image")"
            repository="${image%:*}"
            digest_path="$metadata_dir/$key.tag-digest"
            # Resolve each deployment tag once. Keep this top-level tag/index digest as the exact
            # deployment coordinate; inspect the linux/amd64 child selected through that immutable
            # digest for metadata, labels, and config while Compose keeps the human-readable tag.
            container_command "$digest_path" 60 skopeo inspect --authfile "$authfile" --no-tags --format '{{.Digest}}' \
              "docker://$image"
            resolved_digest="$(<"$digest_path")"
            [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            resolved_image="docker://$repository@$resolved_digest"
            container_command "$metadata_dir/$name.metadata" 60 skopeo inspect --authfile "$authfile" --no-tags \
              --override-os linux --override-arch amd64 --format '{{json .}}' \
              "$resolved_image"
            container_command "$metadata_dir/$name.labels" 60 skopeo inspect --authfile "$authfile" \
              --override-os linux --override-arch amd64 --format '{{json .Labels}}' \
              "$resolved_image"
            container_command "$metadata_dir/$name.config" 60 skopeo inspect --authfile "$authfile" --config \
              --override-os linux --override-arch amd64 \
              "$resolved_image"
          done
          python3 .github/scripts/validate.py image-release-manifest \
            "$metadata_dir" "$GITHUB_REF_NAME" "$manifest_path"
          manifest_digest="sha256:$(sha256sum "$manifest_path" | awk '{print $1}')"
          manifest_size="$(wc -c < "$manifest_path")"
          test "$manifest_size" -gt 0 -a "$manifest_size" -le 1048576
          verify_registry_digests() {
            for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
              image="${!key}"
              expected_digest="$(jq -er --arg key "$key" '.images[$key].digest' "$manifest_path")"
              digest_path="$metadata_dir/$key.digest"
              container_command "$digest_path" 60 skopeo inspect \
                --authfile "$authfile" --no-tags --format '{{.Digest}}' "docker://$image"
              current_digest="$(<"$digest_path")"
              test "$current_digest" = "$expected_digest"
            done
          }
          verify_registry_digests
          export GH_TOKEN="$registry_token"

          release_body="Exact server_state image digest manifest for commit $release_commit."
          check_server_release() {
            local release_path="$1" release_id="$2"
            capture_jq "$release_path" "$release_error_path" --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" \
              --arg name "$manifest_name" --arg digest "$manifest_digest" \
              --arg body "$release_body" \
              --argjson size "$manifest_size" '
                (.id | type) == "number" and (.id | tostring) == $id and (.id == (.id | floor)) and .id > 0 and
                (.body | type) == "string" and .body == $body and
                .tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .immutable == true and
                (.assets | length) == 1 and
                .assets[0].name == $name and (.assets[0] | has("label") and .label == "") and .assets[0].state == "uploaded" and
                (.assets[0].id | type) == "number" and (.assets[0].id == (.assets[0].id | floor)) and .assets[0].id > 0 and
                (.assets[0].size | type) == "number" and (.assets[0].size == (.assets[0].size | floor)) and .assets[0].size == $size and .assets[0].size > 0 and .assets[0].size <= 1048576 and
                (.assets[0].digest | type) == "string" and .assets[0].digest == $digest
              '
          }
          check_server_draft() {
            local release_path="$1" release_id="$2"
            capture_jq "$release_path" "$release_error_path" --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" --arg name "$manifest_name" \
              --arg body "$release_body" '
                (.id | type) == "number" and (.id | tostring) == $id and (.id == (.id | floor)) and .id > 0 and
                (.body | type) == "string" and .body == $body and
                .tag_name == $tag and .name == $tag and .draft == true and .prerelease == false and
                (.assets | type == "array" and length <= 1) and
                ((.assets | length) == 0 or
                  ((.assets | length) == 1 and .assets[0].name == $name and
                   .assets[0].label == "" and
                   .assets[0].state == "uploaded" and
                   (.assets[0].id | type) == "number" and (.assets[0].id == (.assets[0].id | floor)) and .assets[0].id > 0 and
                   (.assets[0].size | type) == "number" and (.assets[0].size == (.assets[0].size | floor)) and .assets[0].size > 0 and .assets[0].size <= 1048576))
              '
          }
          get_release_by_id() {
            local release_id="$1" command_status code
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
            set +e
            capture_command "$release_headers_path" "$release_error_path" 30 \
              gh api --include --hostname github.com \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
            command_status=$?
            set -e
            if code="$(http_status "$release_headers_path")"; then
              :
            else
              command_status="$?"
              replay_capture "$release_headers_path" "$release_error_path" || echo 'release response diagnostics could not be replayed' >&2
              return "$command_status"
            fi
            case "$code" in
              200)
                if [[ "$command_status" -ne 0 ]]; then
                  return "$command_status"
                fi
                if ! http_body "$release_headers_path" >"$release_json_path"; then
                  replay_capture "$release_headers_path" "$release_error_path" || echo 'release response diagnostics could not be replayed' >&2
                  return 1
                fi
                return 0
                ;;
              404)
                if [[ "$command_status" -eq 0 ]]; then
                  replay_capture "$release_headers_path" "$release_error_path" || echo 'release response diagnostics could not be replayed' >&2
                  return 1
                fi
                return 4
              ;;
              *)
                replay_capture "$release_headers_path" "$release_error_path" || echo 'release response diagnostics could not be replayed' >&2
                return 1
                ;;
            esac
          }
          discover_release() {
            local page=1 page_size list_status list_code page_headers page_json match_count extraction_status
            local matches_path="$metadata_dir/release-matches.jsonl"
            : >"$matches_path"
            : >"$matches_path.error"
            while :; do
              page_headers="$metadata_dir/release-page-$page.headers"
              page_json="$metadata_dir/release-page-$page.json"
              set +e
              capture_command "$page_headers" "$page_headers.error" 30 \
                gh api --include --hostname github.com \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page"
              list_status=$?
              set -e
              if [[ "$list_status" -ne 0 ]]; then
                return "$list_status"
              fi
              if list_code="$(http_status "$page_headers")"; then
                :
              else
                list_status="$?"
                replay_capture "$page_headers" "$page_headers.error" || echo 'release list response diagnostics could not be replayed' >&2
                return "$list_status"
              fi
              if [[ "$list_code" != 200 ]]; then
                replay_capture "$page_headers" "$page_headers.error" || echo 'release list response diagnostics could not be replayed' >&2
                return 1
              fi
              if ! http_body "$page_headers" >"$page_json"; then
                replay_capture "$page_headers" "$page_headers.error" || echo 'release list response diagnostics could not be replayed' >&2
                return 1
              fi
              if capture_jq "$page_json" "$page_headers.error" 'type == "array" and length <= 100'; then
                :
              else
                return "$?"
              fi
              if ! jq -c --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | {id,tag_name,draft}' "$page_json" >>"$matches_path"; then
                replay_capture "$page_json" "$page_headers.error" || echo 'release list response diagnostics could not be replayed' >&2
                return 1
              fi
              capture_extract page_size "$page_json" "$page_headers.error" 'length'
              if [[ "$page_size" -lt 100 ]]; then
                break
              fi
              page=$((page + 1))
            done
            if capture_extract match_count "$matches_path" "$matches_path.error" 'length'; then
              :
            else
              extraction_status="$?"
              replay_discovery_pages || echo 'release list diagnostics could not be replayed' >&2
              return "$extraction_status"
            fi
            if [[ "$match_count" -gt 1 ]]; then
              replay_discovery_pages || echo 'release list diagnostics could not be replayed' >&2
              return 1
            fi
            if [[ "$match_count" -eq 0 ]]; then
              release_discovery_state="absent"
              release_id=""
              return 0
            fi
            if capture_extract release_id "$matches_path" "$matches_path.error" -s '.[0].id | select(type == "number" and . == floor and . > 0) | tostring'; then
              :
            else
              extraction_status="$?"
              replay_discovery_pages || echo 'release list diagnostics could not be replayed' >&2
              return "$extraction_status"
            fi
            if capture_extract release_discovery_state "$matches_path" "$matches_path.error" -s 'if .[0].draft == true then "draft" elif .[0].draft == false then "published" else empty end'; then
              :
            else
              extraction_status="$?"
              replay_discovery_pages || echo 'release list diagnostics could not be replayed' >&2
              return "$extraction_status"
            fi
          }
          download_and_compare_manifest() {
            local directory="$1" asset_id="$2"
            mkdir -p "$directory"
            capture_command "$directory/$manifest_name" "$directory/$manifest_name.error" 120 gh api \
              --hostname github.com \
              --header 'Accept: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            if ! cmp -- "$manifest_path" "$directory/$manifest_name"; then
              echo 'downloaded server-state manifest did not match the generated manifest' >&2
              replay_capture "$directory/$manifest_name" "$directory/$manifest_name.error" || echo 'manifest diagnostics could not be replayed' >&2
              return 1
            fi
          }

          # Re-fetch the source identity after all registry work and immediately before the
          # release transaction. The tag and current remote main must still name this commit.
          verify_source_identity
          discover_release
          case "$release_discovery_state" in
            published)
              echo "An exact published Release already exists; refusing to mutate it" >&2
              exit 1
              ;;
            draft)
              get_release_by_id "$release_id"
              check_server_draft "$release_json_path" "$release_id"
              ;;
            absent)
              # Reconfirm the authoritative source immediately before the only create mutation.
              verify_source_identity
              create_path="$metadata_dir/release-create.json"
              set +e
              capture_command "$create_path" "$metadata_dir/release-create.error" 60 \
                gh api --hostname github.com --method POST \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --raw-field "tag_name=$GITHUB_REF_NAME" \
                --raw-field "name=$GITHUB_REF_NAME" \
                --raw-field "body=$release_body" \
                --raw-field "target_commitish=$release_commit" \
                --field draft=true --field prerelease=false \
                "repos/$GITHUB_REPOSITORY/releases"
              create_status=$?
              set -e
              if [[ "$create_status" -eq 0 ]]; then
                capture_extract release_id "$create_path" "$metadata_dir/release-create.error" \
                  '.id | select(type == "number" and . == floor and . > 0) | tostring'
              else
                # A lost create response is recoverable only through a complete, unique draft
                # discovery. Any absent or ambiguous result fails closed.
                discover_release
                if [[ "$release_discovery_state" != draft ]]; then
                  replay_capture "$create_path" "$metadata_dir/release-create.error" || echo 'release create response diagnostics could not be replayed' >&2
                  exit 1
                fi
              fi
              get_release_by_id "$release_id"
              check_server_draft "$release_json_path" "$release_id"
              ;;
            *)
              echo "Release discovery returned an unknown state" >&2
              exit 1
              ;;
          esac
          capture_extract asset_count "$release_json_path" "$release_error_path" '.assets|length'
          if [[ "$asset_count" -eq 0 ]]; then
            test "$manifest_size" -le 1048576
            capture_extract upload_url "$release_json_path" "$release_error_path" '.upload_url | select(type == "string" and test("^https://uploads\\.github\\.com/repos/[^/]+/[^/]+/releases/[0-9]+/assets\\{\\?name,label\\}$"))'
            upload_url="${upload_url%\{*}"
            if [[ "$upload_url" != "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" ]]; then
              echo 'GitHub Release upload URL did not match the exact release identity' >&2
              replay_capture "$release_json_path" "$release_error_path" || echo 'release response diagnostics could not be replayed' >&2
              exit 1
            fi
            timeout --signal=TERM --kill-after=5s 120s \
              gh api --hostname github.com --method POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --input "$manifest_path" "$upload_url?name=$manifest_name"
            get_release_by_id "$release_id"
          fi
          get_release_by_id "$release_id"
          check_server_draft "$release_json_path" "$release_id"
          capture_extract release_asset_id "$release_json_path" "$release_error_path" --arg name "$manifest_name" \
            '.assets | select(length == 1) | .[0] | select(.name == $name and (.id | type == "number" and . == floor and . > 0)) | .id'
          draft_dir="$RUNNER_TEMP/draft-release"
          download_and_compare_manifest "$draft_dir" "$release_asset_id"
          # Reconfirm source and the exact numeric draft immediately before publication.
          verify_source_identity
          get_release_by_id "$release_id"
          check_server_draft "$release_json_path" "$release_id"
          timeout --signal=TERM --kill-after=5s 60s \
            gh api --hostname github.com --method PATCH \
            --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --field draft=false "repos/$GITHUB_REPOSITORY/releases/$release_id"
          final_release_json_path="$RUNNER_TEMP/final-release.json"
          get_release_by_id "$release_id"
          cp -- "$release_json_path" "$final_release_json_path"
          check_server_release "$final_release_json_path" "$release_id"
          capture_extract release_asset_id "$final_release_json_path" "$release_error_path" \
            '.assets[0].id | select(type == "number" and . == floor and . > 0)'
          final_dir="$RUNNER_TEMP/final-release"
          download_and_compare_manifest "$final_dir" "$release_asset_id"
          unset GH_TOKEN
          verify_registry_digests
          unset registry_token
