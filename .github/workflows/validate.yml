name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      synapse_tag:
        description: Exact published Synapse release selected by the caller
        required: true
        type: string
      controlplane_tag:
        description: Exact published Controlplane release selected by the caller
        required: true
        type: string
      cashier_tag:
        description: Exact published Cashier release selected by the caller
        required: true
        type: string

concurrency:
  group: server-state-assembly
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test image and release contracts
        env:
          CADDY_IMAGE: docker.io/caddy:2.11.4-alpine
          SYNAPSE_IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse:${{ inputs.synapse_tag || '1.159-tc27' }}
          MAS_IMAGE: ghcr.io/element-hq/matrix-authentication-service:1.23.0
          CONTROLPLANE_IMAGE: ghcr.io/telecrypt-io/controlplane:${{ inputs.controlplane_tag || '0.5.35' }}
          CASHIER_IMAGE: ghcr.io/telecrypt-io/telecrypt-cashier:${{ inputs.cashier_tag || '0.4.29' }}
          LK_JWT_IMAGE: ghcr.io/element-hq/lk-jwt-service:0.7.0
        run: python3 .github/scripts/test_validate.py

      - name: Parse Quadlet with Stage Podman
        run: |
          set -euo pipefail
          test "$(podman --version)" = "podman version 4.9.3"
          QUADLET_UNIT_DIRS="$GITHUB_WORKSPACE/systemd/quadlet" \
            /usr/lib/systemd/user-generators/podman-user-generator --dryrun --no-kmsg-log \
            > "$RUNNER_TEMP/server-state-generated-units"
          test -s "$RUNNER_TEMP/server-state-generated-units"

      - name: Render masterless Salt states
        run: |
          set -euo pipefail
          salt_version="$(<salt/version)"
          test "$salt_version" = "3008.2"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/salt-archive-keyring.pgp >/dev/null
          curl -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.sources \
            | sudo tee /etc/apt/sources.list.d/salt.sources >/dev/null
          printf 'Package: salt-*\nPin: version 3008.*\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/salt-pin-1001 >/dev/null
          sudo apt-get update
          sudo apt-get install -y "salt-minion=$salt_version" "salt-common=$salt_version"
          pillar_dir="$RUNNER_TEMP/server-state-pillar"
          install -d -m 0700 "$pillar_dir"
          install -m 0600 salt/pillar/top.sls "$pillar_dir/top.sls"
          install -m 0600 salt/pillar/telecrypt.sls.example "$pillar_dir/telecrypt.sls"
          sudo salt-call --local --retcode-passthrough --out=raw \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.host > "$RUNNER_TEMP/salt-host-render"
          test -s "$RUNNER_TEMP/salt-host-render"
          sudo salt-call --local --retcode-passthrough --out=raw \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.services > "$RUNNER_TEMP/salt-services-render"
          test -s "$RUNNER_TEMP/salt-services-render"

      - name: Check selected image availability
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CADDY_IMAGE: docker.io/caddy:2.11.4-alpine
          SYNAPSE_IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse:${{ inputs.synapse_tag }}
          MAS_IMAGE: ghcr.io/element-hq/matrix-authentication-service:1.23.0
          CONTROLPLANE_IMAGE: ghcr.io/telecrypt-io/controlplane:${{ inputs.controlplane_tag }}
          CASHIER_IMAGE: ghcr.io/telecrypt-io/telecrypt-cashier:${{ inputs.cashier_tag }}
          LK_JWT_IMAGE: ghcr.io/element-hq/lk-jwt-service:0.7.0
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/server-state-podman-auth.json"
          trap 'rm -f -- "$authfile"' EXIT
          printf '%s' "$GITHUB_TOKEN" | podman login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE LK_JWT_IMAGE; do
            skopeo inspect --authfile "$authfile" "docker://${!key}" >/dev/null
          done

  assemble:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      CADDY_IMAGE: docker.io/caddy:2.11.4-alpine
      SYNAPSE_IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse:${{ inputs.synapse_tag }}
      MAS_IMAGE: ghcr.io/element-hq/matrix-authentication-service:1.23.0
      CONTROLPLANE_IMAGE: ghcr.io/telecrypt-io/controlplane:${{ inputs.controlplane_tag }}
      CASHIER_IMAGE: ghcr.io/telecrypt-io/telecrypt-cashier:${{ inputs.cashier_tag }}
      LK_JWT_IMAGE: ghcr.io/element-hq/lk-jwt-service:0.7.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the unique annotated Server State tag
        id: release_identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="server-state-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          [[ "$release_tag" =~ ^server-state-[0-9a-f]{7,10}-[1-9][0-9]*$ ]]
          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "immutable Server State tag already exists: $release_tag" >&2
            exit 1
          fi
          annotated_tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$release_tag" \
            -f message="Server State $release_tag" \
            -f object="$GITHUB_SHA" \
            -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$release_tag" -f sha="$annotated_tag_sha" >/dev/null
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'annotated_tag_sha=%s\n' "$annotated_tag_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve selected releases and write the immutable image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_identity.outputs.release_tag }}
          RELEASE_ANNOTATED_TAG_SHA: ${{ steps.release_identity.outputs.annotated_tag_sha }}
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          authdir="$(mktemp -d)"
          authfile="$authdir/auth.json"
          metadata_dir="$(mktemp -d)"
          manifest_name="${RELEASE_TAG}-images.json"
          manifest_path="$RUNNER_TEMP/$manifest_name"
          cleanup() {
            rm -rf -- "$authdir" "$metadata_dir"
            rm -f -- "$manifest_path"
          }
          trap cleanup EXIT

          export SERVER_STATE_ANNOTATED_TAG_SHA="$RELEASE_ANNOTATED_TAG_SHA"
          python3 .github/scripts/validate.py manifest
          METADATA_DIR="$metadata_dir" timeout --signal=TERM --kill-after=5s 240s \
            .github/scripts/fetch_product_releases.sh

          registry_token="$GH_TOKEN"
          unset GH_TOKEN
          printf '%s' "$registry_token" | container_command --sensitive --inherit-stdin \
            "$metadata_dir/skopeo-login.stdout" 30 skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io

          for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE LK_JWT_IMAGE; do
            image="${!key}"
            name="$(python3 .github/scripts/validate.py image-name "$image")"
            repository="${image%:*}"
            digest_path="$metadata_dir/$key.tag-digest"
            container_command "$digest_path" 60 skopeo inspect --authfile "$authfile" --no-tags --format '{{.Digest}}' \
              "docker://$image"
            resolved_digest="$(<"$digest_path")"
            [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            resolved_image="docker://$repository@$resolved_digest"
            container_command "$metadata_dir/$name.metadata" 60 skopeo inspect --authfile "$authfile" --no-tags \
              --override-os linux --override-arch amd64 --format '{{json .}}' "$resolved_image"
            container_command "$metadata_dir/$name.labels" 60 skopeo inspect --authfile "$authfile" \
              --override-os linux --override-arch amd64 --format '{{json .Labels}}' "$resolved_image"
            container_command "$metadata_dir/$name.config" 60 skopeo inspect --authfile "$authfile" --config \
              --override-os linux --override-arch amd64 "$resolved_image"
          done

          python3 .github/scripts/validate.py image-release-manifest \
            "$metadata_dir" "$RELEASE_TAG" "$manifest_path"
          export GH_TOKEN="$registry_token"
          gh release create "$RELEASE_TAG" "$manifest_path" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Server State image digest manifest for commit $GITHUB_SHA." \
            --target "$GITHUB_SHA" \
            --verify-tag
          .github/scripts/verify-release.sh "$RELEASE_TAG" "$manifest_name" "$manifest_path"
          unset GH_TOKEN registry_token
