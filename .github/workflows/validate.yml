name: validate

on:
  push:
    branches: [main]
    tags: ["server-state-*"]

concurrency:
  group: server-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_commit: ${{ steps.release_identity.outputs.release_commit }}
      annotated_tag_sha: ${{ steps.release_identity.outputs.annotated_tag_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact image manifest
        run: python3 .github/scripts/validate.py manifest

      - name: Test image and release contracts
        run: python3 .github/scripts/test_validate.py

      - name: Parse Quadlet with Stage Podman
        run: |
          set -euo pipefail
          test "$(podman --version)" = "podman version 4.9.3"
          QUADLET_UNIT_DIRS="$GITHUB_WORKSPACE/systemd/quadlet" \
            /usr/lib/systemd/user-generators/podman-user-generator --dryrun --no-kmsg-log \
            > "$RUNNER_TEMP/server-state-generated-units"
          test -s "$RUNNER_TEMP/server-state-generated-units"

      - name: Render masterless Salt states
        run: |
          set -euo pipefail
          salt_version="$(<salt/version)"
          test "$salt_version" = "3008.2"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/salt-archive-keyring.pgp >/dev/null
          curl -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.sources \
            | sudo tee /etc/apt/sources.list.d/salt.sources >/dev/null
          printf 'Package: salt-*\nPin: version 3008.*\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/salt-pin-1001 >/dev/null
          sudo apt-get update
          sudo apt-get install -y "salt-minion=$salt_version" "salt-common=$salt_version"
          pillar_dir="$RUNNER_TEMP/server-state-pillar"
          install -d -m 0700 "$pillar_dir"
          install -m 0600 salt/pillar/top.sls "$pillar_dir/top.sls"
          install -m 0600 salt/pillar/telecrypt.sls.example "$pillar_dir/telecrypt.sls"
          sudo salt-call --local --retcode-passthrough --out=quiet \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.host
          sudo salt-call --local --retcode-passthrough --out=quiet \
            --file-root="$GITHUB_WORKSPACE" --pillar-root="$pillar_dir" \
            state.show_sls salt.services

      - name: Check exact image manifest availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/server-state-podman-auth.json"
          trap 'rm -f -- "$authfile"' EXIT
          printf '%s' "$GITHUB_TOKEN" | podman login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          while IFS='=' read -r key image; do
            skopeo inspect --authfile "$authfile" "docker://$image" >/dev/null
          done < versions.env

      - name: Verify selected annotated release identity
        id: release_identity
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          release_tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$release_tag_ref")" = tag
          release_commit="$(git rev-parse "$release_tag_ref^{commit}")"
          release_suffix="${GITHUB_REF_NAME#server-state-}"
          [[ "$release_commit" == "$release_suffix"* ]]
          test "$release_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$release_commit"
          timeout --signal=TERM --kill-after=5s 30s git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'annotated_tag_sha=%s\n' "$(git rev-parse "$release_tag_ref")" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-state-')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
      RELEASE_ANNOTATED_TAG_SHA: ${{ needs.validate.outputs.annotated_tag_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected release checkout
        id: selected_release_identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          release_commit="${RELEASE_COMMIT:?validated release commit was not passed from the validation job}"
          annotated_tag_sha="${RELEASE_ANNOTATED_TAG_SHA:?validated annotated tag was not passed from the validation job}"
          release_tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$release_commit"
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$(git cat-file -t "$release_tag_ref")" = tag
          test "$(git rev-parse "$release_tag_ref")" = "$annotated_tag_sha"
          test "$(git rev-parse "$release_tag_ref^{commit}")" = "$release_commit"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/container-helpers.sh
          authdir="$(mktemp -d)"
          authfile="$authdir/auth.json"
          metadata_dir="$(mktemp -d)"
          manifest_name="server-state-${GITHUB_REF_NAME#server-state-}-images.json"
          manifest_path="$RUNNER_TEMP/$manifest_name"
          cleanup() {
            rm -rf -- "$authdir" "$metadata_dir"
            rm -f -- "$manifest_path"
          }
          trap cleanup EXIT

          release_commit="$RELEASE_COMMIT"
          export SERVER_STATE_ANNOTATED_TAG_SHA="$RELEASE_ANNOTATED_TAG_SHA"
          python3 .github/scripts/validate.py manifest

          source versions.env
          METADATA_DIR="$metadata_dir" timeout --signal=TERM --kill-after=5s 240s .github/scripts/fetch_product_releases.sh
          registry_token="$GH_TOKEN"
          unset GH_TOKEN
          skopeo_login_output="$metadata_dir/skopeo-login.stdout"
          if ! printf '%s' "$registry_token" | container_command --sensitive --inherit-stdin "$skopeo_login_output" 30 skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io; then
            unset registry_token
            rm -f -- "$skopeo_login_output" "$skopeo_login_output.stderr"
            echo 'registry authentication failed' >&2
            exit 1
          fi
          rm -f -- "$skopeo_login_output" "$skopeo_login_output.stderr"
          for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
            image="${!key}"
            name="$(python3 .github/scripts/validate.py image-name "$image")"
            repository="${image%:*}"
            digest_path="$metadata_dir/$key.tag-digest"
            # Keep the selected registry index digest as the deployment coordinate and inspect its
            # linux/amd64 image for the OCI config and provenance labels used by the release manifest.
            container_command "$digest_path" 60 skopeo inspect --authfile "$authfile" --no-tags --format '{{.Digest}}' \
              "docker://$image"
            resolved_digest="$(<"$digest_path")"
            [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            resolved_image="docker://$repository@$resolved_digest"
            container_command "$metadata_dir/$name.metadata" 60 skopeo inspect --authfile "$authfile" --no-tags \
              --override-os linux --override-arch amd64 --format '{{json .}}' \
              "$resolved_image"
            container_command "$metadata_dir/$name.labels" 60 skopeo inspect --authfile "$authfile" \
              --override-os linux --override-arch amd64 --format '{{json .Labels}}' \
              "$resolved_image"
            container_command "$metadata_dir/$name.config" 60 skopeo inspect --authfile "$authfile" --config \
              --override-os linux --override-arch amd64 \
              "$resolved_image"
          done
          python3 .github/scripts/validate.py image-release-manifest \
            "$metadata_dir" "$GITHUB_REF_NAME" "$manifest_path"
          verify_registry_digests() {
            for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
              image="${!key}"
              expected_digest="$(jq -er --arg key "$key" '.images[$key].digest' "$manifest_path")"
              digest_path="$metadata_dir/$key.digest"
              container_command "$digest_path" 60 skopeo inspect \
                --authfile "$authfile" --no-tags --format '{{.Digest}}' "docker://$image"
              test "$(<"$digest_path")" = "$expected_digest"
            done
          }
          verify_registry_digests
          export GH_TOKEN="$registry_token"

          gh release create "$GITHUB_REF_NAME" "$manifest_path" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Server State image digest manifest for commit $release_commit." \
            --target "$release_commit" \
            --verify-tag
          .github/scripts/verify-release.sh \
            "$GITHUB_REF_NAME" "$manifest_name" "$manifest_path"
          verify_registry_digests
          unset GH_TOKEN registry_token
