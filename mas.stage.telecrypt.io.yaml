# MAS Stage profile. These deliberately unsafe values make authentication and registration
# throttling immaterial to parallel acceptance tests while retaining the positive values required
# by MAS 1.23's schema.
rate_limiting:
  login:
    per_ip:
      burst: 100000
      per_second: 1000.0
    per_account:
      burst: 100000
      per_second: 1000.0
  registration:
    burst: 100000
    per_second: 1000.0
